# do not modify these
root: ./
name: examples
socket_name: ros_bt
attach: false
# you can modify these
startup_window: sub_pub_bt
windows:
  - publisher:
      layout: tiled
      panes:
        - ros2 launch simple_sub_pub publisher_launch.py
  - bt_node:
      layout: tiled
      panes:
        - sleep 3; ros2 launch simple_sub_pub simple_bt_node_launch.py
  - subscriber:
      layout: tiled
      panes:
        - sleep 3; ros2 launch simple_sub_pub subscriber_launch.py