# do not modify these
root: ./
name: examples
socket_name: ros_bt
attach: false
# you can modify these
startup_window: sub_pub_bt
windows:
  - publisher:
      layout: tiled
      panes:
        - ros2 launch ros_behaviortree_examples publisher_launch.py
  - bt_node:
      layout: tiled
      panes:
        - sleep 5; ros2 launch ros_behaviortree_examples simple_bt_node_launch.py