# do not modify these
root: ./
name: examples
socket_name: ros_bt
attach: false
# you can modify these
startup_window: sub_pub_bt
windows:
  - publisher:
      layout: tiled
      panes:
        - rostopic pub -r 10 /ros_bt_examples/dummy/string std_msgs/String
  - subsciber:
      layout: tiled
      panes:
        - sleep 5; rostopic echo /ros_bt_examples/sub_pub/log
  - sub_pub_bt:
      layout: tiled
      panes:
        - roslaunch ros_bt_examples sub_pub_example.launch